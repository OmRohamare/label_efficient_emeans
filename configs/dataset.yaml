# Dataset configuration
dataset:
  name: "zh-plus/tiny-imagenet"
  split_train: "train"
  split_valid: "valid"
  num_classes: 200
  image_size_original: 64        # native resolution of Tiny-ImageNet
  image_size_model: 224          # DINOv2 ViT input resolution
  num_train_samples: 100000      # 500 images × 200 classes
  num_valid_samples: 10000       # 50 images × 200 classes

preprocessing:
  resize_to: 224
  interpolation: "bicubic"       # PIL.Image.BICUBIC
  center_crop: 224
  # DINOv2 ImageNet normalisation
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

cache:
  root: "cache"                  # relative to project root
  train_feats_file: "train_feats.npy"
  valid_feats_file: "valid_feats.npy"
  train_labels_file: "train_labels.npy"
  valid_labels_file: "valid_labels.npy"
  feature_dim: 384               # DINOv2 ViT-S/14 CLS dim

dataloader:
  batch_size: 256
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
